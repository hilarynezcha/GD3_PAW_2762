<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Interaktif</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="profil.html">Ke Halaman Profil</a> | 
    <a href="form.html">Ke Halaman Form</a>

    <h1 id="judulHalaman">Halaman Interaktif Saya</h1>

    <p id="teks">Teks ini bisa berubah!</p>
    <button onclick="ubahBiru()">Ubah ke Biru</button>

    <br><br>
    <input type="text" id="inputNama" placeholder="Ketik nama kamu...">
    <button onclick="tampilkanNama()">Tampilkan</button>
</body>

<script>
    const judul = document.getElementById("judulHalaman");
    judul.style.color = "navy";
    console.log(judul.innerHTML);

    function sapa(nama) {
            return "Halo, " + nama + "!";
        }
        console.log(sapa("Nezcha"));

    function ubahBiru() {
        const elemenTeks = document.getElementById("teks");
        elemenTeks.style.color = "blue";
        }

    function tampilkanNama() {
        const nama = document.getElementById("inputNama").value;
            if (nama === "") {
                alert("Silakan isi nama dulu.");
            } else {
                 alert("Halo, " + nama + "!");
            }
    }
</script>

</html>
