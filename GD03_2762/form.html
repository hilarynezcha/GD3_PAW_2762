<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="profil.html" onclick="return confirm('Yakin ingin kembali ke Profil?')">Kembali ke Profil</a>
    <a href="interaktif.html" onclick="return confirm('Yakin ingin pindah ke Halaman Interaktif?')">Buka Halaman Interaktif</a>
    <h1>Form Pendaftaran</h1>

    <form action="#" method="post"> 
        <label for="inputNama">Nama Lengkap:</label><br>
        <input type="text" id="inputNama" name="nama" required><br><br>

        <label for="inputEmail">Email:</label><br>
        <input type="email" id="inputEmail" name="email" required><br><br>

        <label>Jenis Kelamin:</label><br>
        <input type="radio" id="pria" name="gender" value="Pria" required>
        <label for="pria">Pria</label>
        <input type="radio" id="wanita" name="gender" value="Wanita" required>
        <label for="wanita">Wanita</label><br><br>
   
    <label for="inputProdi">Program Studi:</label><br>
    <select id="inputProdi" name="prodi" required>
        <option value="">-- Pilih Program Studi --</option>
        <option value="Sistem Informasi">Sistem Informasi</option>
        <option value="Informatika">Informatika</option>
    </select><br><br>

    <label for="inputAlasan">Alasan Mendaftar:</label><br>
    <textarea id="inputAlasan" name="alasan" rows="4" cols="30" required></textarea><br><br>

    <button type="submit">Kirim Pendaftaran</button>
</form>
</body>
</html>
